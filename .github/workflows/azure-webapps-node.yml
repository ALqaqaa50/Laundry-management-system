# Deploy Next.js to Azure App Service (Linux, Node.js 20)
#
# === SETUP REQUIRED (one-time) ===
# 1. Create Azure App Service:
#    - Runtime: Node.js 20 LTS, Linux
#    - Name: laundry-parts-hub  (must match AZURE_WEBAPP_NAME below)
#    - Startup command: node server.js
#
# 2. Create a Service Principal and add these 3 GitHub Secrets:
#    AZURE_CLIENT_ID       → App Registration → Application (client) ID
#    AZURE_TENANT_ID       → App Registration → Directory (tenant) ID
#    AZURE_SUBSCRIPTION_ID → Azure Portal → Subscriptions → Subscription ID
#
#    To create the service principal, run in Azure Cloud Shell:
#    az ad sp create-for-rbac --name "laundry-parts-hub-deploy" \
#      --role contributor \
#      --scopes /subscriptions/<SUBSCRIPTION_ID>/resourceGroups/<RESOURCE_GROUP> \
#      --sdk-auth
#    Then enable federated credentials for GitHub OIDC (or use the JSON as AZURE_CREDENTIALS)
#
# 3. Add environment variables in Azure Portal → App Service → Configuration → Application settings:
#    ADMIN_PASSWORD        your-admin-password
#    ADMIN_EMAIL           your@email.com  (optional)
#    SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASS / SMTP_FROM  (optional)
#    NEXT_PUBLIC_SITE_URL  https://laundry-parts-hub.azurewebsites.net
#
# After these steps every push to main deploys automatically.

name: Build and Deploy to Azure Web App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: laundry-parts-hub
  NODE_VERSION: '20.x'

permissions:
  contents: read
  id-token: write   # required for OIDC login

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (standalone output)
        run: npm run build

      - name: Prepare deployment package
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public       .next/standalone/public
          cp -r data         .next/standalone/data

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone/

  deploy:
    permissions:
      contents: none
      id-token: write   # required for OIDC login
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Azure Login
        uses: Azure/login@v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .
          startup-command: 'node server.js'
